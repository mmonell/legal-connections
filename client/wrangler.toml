name = "legal-connections"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "legal-connections"
database_id = "04bc3219-020e-4658-8957-40971c398a9b"

# Secrets are NOT set here — use `wrangler secret put <NAME>` so they
# never land in version control. See docs/guides/DEPLOYING.md and
# test/.env.example for the full list (CONTACT_EMAIL, CONTACT_SENDER_EMAIL,
# AWS_SES_KEY, AWS_SES_SECRET, AWS_REGION).
#
# To set them once you have real values:
#   wrangler secret put CONTACT_EMAIL
#   wrangler secret put CONTACT_SENDER_EMAIL
#   wrangler secret put AWS_SES_KEY
#   wrangler secret put AWS_SES_SECRET
#   wrangler secret put AWS_REGION
#
# Default sender if CONTACT_SENDER_EMAIL is unset: do-not-reply@mail.legal-connections.com
# (see test/.env.example and test/src/shared/mailer.js). Sent from the
# "mail." subdomain, not the root domain, to isolate sending reputation.
